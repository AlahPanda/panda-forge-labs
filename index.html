<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlahPanda Labs — Modpacks and experiences</title>
    
    <!-- Mini Logo (Favicon) -->
    <link rel="icon" href="/favicon.ico" />

    <meta name="description" content="Explore modpacks and experiences created by AlahPanda." />
    <meta name="author" content="AlahPanda Labs" />
    <meta name="theme-color" content="#f8f5f0" />
    <script>
      // Apply the chosen theme before styles paint.
      try {
        var savedTheme = localStorage.getItem('apl.theme');
        var darkTheme = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', darkTheme);
        document.documentElement.style.colorScheme = darkTheme ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', darkTheme ? '#121c2b' : '#f6f0e6');
      } catch (error) { /* ThemeProvider handles unavailable storage. */ }
    </script>

    <meta property="og:title" content="AlahPanda Labs — Modpacks and experiences" />
    <meta property="og:description" content="Explore modpacks and experiences created by AlahPanda." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
